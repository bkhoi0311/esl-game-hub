<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt hình từ vựng</title>
<style>
  :root {
    --bg: #eef3f8; --surface: rgba(255,255,255,.72); --surface-solid: #fff; --text: #1c1f25; --muted: #5d6673;
    --rim: rgba(255,255,255,.9); --edge: rgba(28,31,37,.10); --tint: #04bc09; --tint-ink: #037a07; --bad: #e5484d; --bad-soft: #ffe5e6;
    --radius: 18px; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --surface: rgba(30,34,40,.72); --surface-solid: #1c2026; --text: #f2f4f7; --muted: #9aa3ad;
      --rim: rgba(255,255,255,.08); --edge: rgba(255,255,255,.10); --tint-ink: #5fe063; --bad-soft: #3a1c1e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); }
  header { position: sticky; top: 0; z-index: 5; padding: 14px 16px 12px; background: var(--surface);
    backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border-bottom: 1px solid var(--edge); box-shadow: inset 0 -1px 0 var(--rim); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 12px 0 0; letter-spacing: -.01em; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--edge); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg button { flex: none; }
  body { overflow-x: hidden; }
  .seg button { border: 0; background: none; color: var(--text); font: 600 14px var(--font); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--surface-solid); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg small { color: var(--muted); font-weight: 500; margin-left: 4px; }
  input[type=search] { flex: 1 1 180px; min-width: 0; border: 1px solid var(--edge); background: var(--surface-solid); color: var(--text);
    font: 15px var(--font); padding: 8px 14px; border-radius: 999px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--edge); background: var(--surface-solid); color: var(--text);
    font: 600 14px var(--font); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .chip.primary { background: var(--tint); border-color: var(--tint); color: #fff; }
  .chip[aria-pressed=true] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .hint { color: var(--muted); font-size: 13px; max-width: 1400px; margin: 8px auto 0; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .card { position: relative; display: grid; justify-items: center; gap: 6px; padding: 12px 8px 10px; border-radius: var(--radius);
    background: var(--surface-solid); border: 1px solid var(--edge); cursor: pointer; text-align: center; color: var(--text); font: inherit;
    transition: transform .12s ease, border-color .12s ease; }
  .card:hover { transform: translateY(-1px); }
  .card:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; }
  .card img { width: 64px; height: 64px; }
  .card .num { height: 64px; display: grid; place-items: center; font: 800 34px var(--font); }
  .card b { font-size: 15px; word-break: break-word; }
  .card em { font-style: normal; font-size: 12px; color: var(--muted); line-height: 1.25; }
  .card em:empty { display: none; }
  .card i { font-style: normal; font-size: 11px; color: var(--muted); }
  .card.bad { background: var(--bad-soft); border-color: var(--bad); }
  .card.bad::after { content: "Sai"; position: absolute; top: 6px; right: 8px; font: 700 11px var(--font); color: #fff; background: var(--bad); padding: 2px 7px; border-radius: 999px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px;
    border-radius: 999px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
  @media (max-width: 600px) { main { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); } .card img, .card .num { width: 52px; height: 52px; } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Duyệt hình từ vựng</h1>
    <div class="seg" id="levels" role="group" aria-label="Cấp"></div>
    <input type="search" id="q" placeholder="Tìm từ…" aria-label="Tìm từ">
    <button class="chip" id="onlyBad" aria-pressed="false">Chỉ xem hình sai</button>
    <button class="chip primary" id="copy">Chép danh sách sai (<span id="nBad">0</span>)</button>
  </div>
  <p class="hint">Thẻ "kèm câu": trong game hình hiện cùng câu gợi ý bên dưới. Bấm vào thẻ có hình sai để đánh dấu, bấm lần nữa để bỏ. Xong bấm "Chép danh sách sai" rồi dán vào chat, có thể ghi thêm hình mong muốn cạnh từng từ. Dấu đánh được lưu trên trình duyệt này.</p>
</header>
<main id="grid"></main>
<div id="toast" role="status"></div>
<script>
const DATA = /*DATA*/null;
const LEVELS = ['Starters', 'Movers', 'Flyers', 'KET', 'PET'];
const KEY = 'pics-review-bad';
let bad = new Set();
try { bad = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...bad])); } catch (e) {} };
let level = 'Starters', onlyBad = false;
const $ = (s) => document.querySelector(s);
const urls = {};
for (const [c, b] of Object.entries(DATA.svgs)) urls[c] = 'data:image/svg+xml;base64,' + b;

function renderLevels() {
  const el = $('#levels'); el.textContent = '';
  for (const l of [...LEVELS, 'Tất cả']) {
    const n = DATA.items.filter((x) => l === 'Tất cả' || x.l === l).length;
    const b = document.createElement('button');
    b.setAttribute('aria-pressed', String(l === level));
    b.innerHTML = `${l}<small>${n}</small>`;
    b.onclick = () => { level = l; renderLevels(); render(); };
    el.append(b);
  }
}
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = DATA.items.filter((x) => (level === 'Tất cả' || x.l === level) && (!q || x.w.includes(q)) && (!onlyBad || bad.has(x.w)));
  const grid = $('#grid'); grid.textContent = '';
  const frag = document.createDocumentFragment();
  for (const x of list) {
    const card = document.createElement('button');
    card.className = 'card' + (bad.has(x.w) ? ' bad' : '');
    card.title = x.e || '';
    const pic = x.c[0] === '#' ? `<span class="num">${x.c.slice(1)}</span>` : `<img src="${urls[x.c]}" alt="" loading="lazy">`;
    card.innerHTML = `${pic}<b></b><em></em><i>${x.l}${x.h ? ' · kèm câu' : ''}</i>`;
    card.querySelector('b').textContent = x.w;
    card.querySelector('em').textContent = x.h || '';
    card.onclick = () => { bad.has(x.w) ? bad.delete(x.w) : bad.add(x.w); save(); card.classList.toggle('bad'); count(); if (onlyBad) render(); };
    frag.append(card);
  }
  if (!list.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Không có từ nào.'; frag.append(p); }
  grid.append(frag);
}
function count() { $('#nBad').textContent = bad.size; }
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.opacity = 1; setTimeout(() => (el.style.opacity = 0), 1800); }
$('#q').oninput = render;
$('#onlyBad').onclick = (e) => { onlyBad = !onlyBad; e.currentTarget.setAttribute('aria-pressed', String(onlyBad)); render(); };
$('#copy').onclick = async () => {
  const lv = Object.fromEntries(DATA.items.map((x) => [x.w, x.l]));
  const text = 'Hình sai cần sửa:\n' + [...bad].sort().map((w) => `- ${w} (${lv[w] || ''}): `).join('\n');
  try { await navigator.clipboard.writeText(text); toast(`Đã chép ${bad.size} từ`); }
  catch (e) { prompt('Chép đoạn này:', text); }
};
renderLevels(); render(); count();
</script>
</body>
</html>
